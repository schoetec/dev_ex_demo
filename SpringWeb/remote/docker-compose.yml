version: '3.8'

services:
  webportal:
    image: ghcr.io/schoetec/dev_ex_flow/webportal:latest
    ports:
      - "8090:8090"
    depends_on:
      - webservice
    environment:
      - BASE_URL=http://webservice:8080
    restart: unless-stopped
  webservice:
    image: ghcr.io/schoetec/dev_ex_flow/webservice:latest
    ports:
      - "8080:8080"
    restart: unless-stopped

networks:
  default:
    driver: bridge
